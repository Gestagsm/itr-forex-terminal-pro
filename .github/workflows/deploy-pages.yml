name: Deploy ITR Forex Terminal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: itr-terminal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload terminal frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public
      - name: Deploy terminal to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4